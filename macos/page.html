<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<style>
:root {
  --bg: #fafaf9; --surface: #ffffff; --sunken: #f2f2f0; --fg: #1d1d1f; --muted: #6e6e73; --faint: #a1a1a6;
  --line: rgb(0 0 0 / 0.09); --accent: #2f6fde; --accent-soft: rgb(47 111 222 / 0.1);
  --danger: #c4372b; --danger-soft: rgb(196 55 43 / 0.1); --select: rgb(255 196 0 / 0.16);
  --shadow: 0 6px 24px rgb(0 0 0 / 0.14);
  --sans: system-ui, -apple-system, "Hiragino Sans", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, "Hiragino Sans", monospace;
  --width: 980px;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #18181a; --surface: #202023; --sunken: #2a2a2e; --fg: #ececf0; --muted: #9a9aa2; --faint: #66666d;
    --line: rgb(255 255 255 / 0.09); --accent: #7aa7ff; --accent-soft: rgb(122 167 255 / 0.14);
    --danger: #ff8a7a; --danger-soft: rgb(255 138 122 / 0.12); --select: rgb(255 196 0 / 0.12);
    --shadow: 0 6px 24px rgb(0 0 0 / 0.5);
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; display: flex; flex-direction: column; background: var(--bg); color: var(--fg); font: 14px/1.5 var(--sans); }
code, pre, textarea, input { font-family: var(--mono); }
pre { margin: 0; padding: 10px 12px; max-height: 60vh; overflow: auto; background: var(--sunken); border-radius: 8px; font-size: 13px; white-space: pre-wrap; }
button { font: inherit; color: var(--muted); background: none; border: 0; border-radius: 6px; padding: 2px 7px; cursor: pointer; }
button:hover { color: var(--fg); background: var(--sunken); }
button code { color: var(--accent); }
.muted { color: var(--muted); font-size: 12px; }

#out { flex: 1; overflow: auto; padding: 24px 16px 32px; }
#out > * { max-width: var(--width); margin: 0 auto 32px; }

.welcome { padding-top: 24vh; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.chip { display: inline-flex; align-items: center; gap: 2px; padding: 2px 4px 2px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--fg); font-size: 12px; }
.welcome .chip { padding: 4px 12px; font-size: 13px; }
.chip button { padding: 0 6px; }

.turn > header { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
.badge { flex: none; padding: 1px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: 12px; }
.said { flex: 1; min-width: 0; font-weight: 600; white-space: pre-wrap; overflow-wrap: anywhere; }
.said code { font-weight: 500; }
.status { display: flex; align-items: center; gap: 6px; }
.turn > header .status button { visibility: hidden; }
.turn:hover > header .status button, .spinner + button { visibility: visible; }
.spinner { width: 12px; height: 12px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.block { margin: 10px 0; }
.block:not(.md) { width: fit-content; min-width: min(420px, 100%); max-width: 100%; }
.bar { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.bar > .muted { margin-right: auto; }
.bar > :not(.muted) { opacity: 0.45; transition: opacity 0.15s; }
.block:hover .bar > *, .bar:focus-within > * { opacity: 1; }
.segmented { display: inline-flex; padding: 2px; border-radius: 8px; background: var(--sunken); }
.segmented button { padding: 1px 9px; font-size: 12px; }
.segmented button.active { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgb(0 0 0 / 0.12); }
.split { position: relative; display: inline-flex; }
.split button { font-size: 12px; }
.view.stale { opacity: 0.45; }

.transform { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 8px; }
.stage { display: inline-flex; align-items: center; padding: 0 2px 0 8px; border-radius: 6px; background: var(--accent-soft); font-size: 12px; }
.stage code { color: var(--accent); }
.stage button { padding: 0 5px; }
.stage.failed { background: var(--danger-soft); }
.stage.failed code { color: var(--danger); }
.view-input { flex: 1 1 200px; min-width: 0; padding: 3px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: inherit; font-size: 12px; }
.view-input:focus, #input:focus { outline: 0; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.transform button { font-size: 12px; }

.error { margin: 8px 0; padding: 8px 12px; border-radius: 8px; background: var(--danger-soft); color: var(--danger); font: 13px var(--mono); white-space: pre-wrap; }

.table-wrap { width: fit-content; max-width: 100%; max-height: 60vh; overflow: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.grid { border-collapse: separate; border-spacing: 0; font-size: 13px; }
.grid th, .grid td { padding: 5px 12px; text-align: left; white-space: nowrap; border-bottom: 1px solid var(--line); vertical-align: top; }
.grid tr:last-child td { border-bottom: 0; }
.grid thead th { position: sticky; top: 0; z-index: 2; background: var(--surface); font-weight: 600; font-size: 12px; color: var(--muted); }
.grid th button { padding: 0; color: inherit; font-weight: 600; }
.grid th button:hover { background: none; color: var(--fg); }
.grid th .hide { margin-left: 4px; visibility: hidden; }
.grid th:hover .hide { visibility: visible; }
.arrow { color: var(--accent); }
.grid td { position: relative; cursor: pointer; }
.grid tbody tr:hover td { background: var(--accent-soft); }
.grid tr.selected td { background: var(--select); }
.grid .sel { width: 1px; padding: 5px 0 5px 8px; }
.check { padding: 0; color: var(--faint); visibility: hidden; }
.grid tr:hover .check, .grid.selecting .check { visibility: visible; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; text-align: right !important; }
.date { font-family: var(--mono); color: var(--muted); }
.null { color: var(--faint); }
.nested { color: var(--muted); font-style: italic; }
.bool { color: var(--accent); }
.key { font-weight: 600; }
.more { margin-top: 6px; }
.scalar { font: 600 32px/1.2 var(--mono); padding: 4px 0; }
.hint { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin-top: 6px; }

.menu { position: fixed; z-index: 20; display: flex; flex-direction: column; min-width: 180px; max-height: calc(100vh - 16px); overflow: auto; padding: 4px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); box-shadow: var(--shadow); font: 13px var(--sans); text-align: left; cursor: default; }
.menu .item { text-align: left; padding: 4px 8px; color: var(--fg); }

.tree { padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font: 13px var(--mono); }
.tree ul { list-style: none; margin: 0; padding-left: 16px; }
.tree > ul { padding-left: 0; }
.tree .key { color: var(--accent); cursor: pointer; font-weight: 500; }
.tree .key:hover { text-decoration: underline; }

.md { line-height: 1.7; }
.md > :first-child { margin-top: 0; }
.md h1, .md h2, .md h3 { line-height: 1.3; margin: 1em 0 0.4em; }
.md h1 { font-size: 20px; } .md h2 { font-size: 17px; } .md h3 { font-size: 15px; }
.md p { margin: 0.5em 0; }
.md :not(pre) > code { padding: 1px 5px; border-radius: 4px; background: var(--sunken); font-size: 0.92em; }
.md blockquote { margin: 0.5em 0; padding-left: 12px; border-left: 3px solid var(--line); color: var(--muted); }
.md a { color: var(--accent); }
.figure svg { max-width: 100%; height: auto; }
.block iframe { display: block; width: min(760px, 100%); height: 260px; border: 1px solid var(--line); border-radius: 8px; background: #fff; resize: vertical; }
.block img { max-width: 100%; border-radius: 8px; }

.step { margin: 6px 0 10px; padding-left: 12px; border-left: 2px solid var(--line); }
.step summary { display: flex; align-items: baseline; gap: 8px; cursor: pointer; list-style: none; color: var(--muted); }
.step summary::-webkit-details-marker { display: none; }
.step summary::before { content: "▸"; color: var(--faint); }
.step[open] summary::before { content: "▾"; }
.step summary code { color: var(--fg); }
.step .badge { background: var(--sunken); color: var(--muted); }

.selection { position: fixed; bottom: 112px; left: 50%; transform: translateX(-50%); z-index: 15; display: flex; align-items: center; gap: 8px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); box-shadow: var(--shadow); font-size: 13px; }

.composer { border-top: 1px solid var(--line); background: var(--surface); padding: 10px 16px 14px; }
.composer > * { max-width: var(--width); margin: 0 auto; }
#controls { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 8px; }
.compose-row { display: flex; align-items: flex-end; gap: 6px; }
#input { flex: 1; min-width: 0; resize: none; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: inherit; font-size: 14px; line-height: 1.5; }
#send { padding: 7px 14px; border-radius: 10px; background: var(--accent); color: #fff; }
#send:hover { filter: brightness(1.08); }
#toast { position: fixed; bottom: 120px; left: 50%; transform: translate(-50%, 8px); opacity: 0; padding: 6px 12px; border-radius: 8px; background: var(--fg); color: var(--bg); font-size: 13px; pointer-events: none; transition: opacity 0.2s, transform 0.2s; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
::placeholder { color: var(--faint); }
</style>
<main id="out"></main>
<footer class="composer">
  <div id="controls"></div>
  <div class="compose-row">
    <textarea id="input" rows="1" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea>
    <button id="send">送信</button>
  </div>
</footer>
<div id="toast"></div>
<script>
const out = document.getElementById("out");
const input = document.getElementById("input");
const controls = document.getElementById("controls");
const toast = document.getElementById("toast");

function send(tag, fields) {
  webkit.messageHandlers.patchbay.postMessage(JSON.stringify(fields ? [tag, fields] : tag));
}

let toastTimer;
function flash(message) {
  toast.textContent = message;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove("show"), 1800);
}

// Why not replace the whole transcript: embedded pages would reload and
// scroll positions reset.
const drawn = new Map();
function drawTranscript(html) {
  const template = document.createElement("template");
  template.innerHTML = html;
  const fresh = [...template.content.firstElementChild.children];
  const keys = new Set(fresh.map((el) => el.dataset.key));
  for (const el of [...out.children]) if (!keys.has(el.dataset.key)) el.remove();
  let prev = null;
  for (const el of fresh) {
    const key = el.dataset.key;
    let current = out.querySelector(`:scope > [data-key="${key}"]`);
    if (!current || drawn.get(key) !== el.outerHTML) {
      drawn.set(key, el.outerHTML);
      if (current) {
        const restore = keepState(current);
        current.replaceWith(el);
        restore(el);
      }
      current = el;
    }
    if ((prev ? prev.nextElementSibling : out.firstElementChild) !== current) {
      prev ? prev.after(current) : out.prepend(current);
    }
    prev = current;
  }
}

// Why not take the view transform text from the frame: while typing, frames
// answer text that is already older than the field.
function keepState(old) {
  const focused = old.contains(document.activeElement) && document.activeElement.dataset.view;
  const { value, selectionStart, selectionEnd } = document.activeElement;
  const scrolls = [...old.querySelectorAll(".table-wrap")].map((w) => [w.scrollLeft, w.scrollTop]);
  return (el) => {
    el.querySelectorAll(".table-wrap").forEach((w, i) => scrolls[i] && ([w.scrollLeft, w.scrollTop] = scrolls[i]));
    const field = focused && el.querySelector(`[data-view="${focused}"]`);
    if (field) {
      field.value = value;
      field.focus();
      field.setSelectionRange(selectionStart, selectionEnd);
    }
  };
}

window.patchbay = {
  receive(frame) {
    drawTranscript(frame.html);
    controls.innerHTML = frame.controls;
    input.placeholder = frame.placeholder;
    if (frame.input != null) {
      input.value = frame.input;
      autosize();
      input.focus();
    }
    if (frame.notice) flash(frame.notice);
    placeMenu();
    if (frame.scroll) out.lastElementChild?.scrollIntoView({ block: "start" });
  },
};

// Why not position the menu in CSS: the scrolling table would clip it.
function placeMenu() {
  const menu = document.querySelector(".menu");
  if (!menu) return;
  const cell = menu.parentElement.getBoundingClientRect();
  const below = cell.bottom + menu.offsetHeight <= innerHeight;
  menu.style.left = `${Math.min(cell.left, innerWidth - menu.offsetWidth - 8)}px`;
  menu.style.top = `${below ? cell.bottom : Math.max(8, cell.top - menu.offsetHeight)}px`;
}
addEventListener("scroll", placeMenu, true);
addEventListener("resize", placeMenu);

function autosize() {
  input.style.height = "auto";
  input.style.height = `${Math.min(input.scrollHeight, 200)}px`;
}
input.addEventListener("input", autosize);
document.getElementById("send").addEventListener("click", () => send("Send", { text: input.value }));

input.addEventListener("keydown", (e) => {
  // Why not only `isComposing`: Safari reports the Enter that confirms an IME
  // conversion with keyCode 229 instead.
  if (e.isComposing || e.keyCode === 229) return;
  const atStart = input.selectionStart === 0 && input.selectionEnd === 0;
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    send("Send", { text: input.value });
  } else if ((e.key === "ArrowUp" && atStart) || (e.key === "ArrowDown" && input.selectionStart === input.value.length)) {
    e.preventDefault();
    send("History", { delta: e.key === "ArrowUp" ? -1 : 1, text: input.value });
  }
});

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") send("Escape");
});

out.addEventListener("input", (e) => {
  if (e.target.dataset.view) send("View", { block: +e.target.dataset.view, text: e.target.value });
});

// Why not let shift-click select text: it extends the row selection.
document.addEventListener("mousedown", (e) => {
  if (e.shiftKey && e.target.closest(".check")) e.preventDefault();
});

document.addEventListener("click", (e) => {
  const link = e.target.closest("a[href]");
  if (link) {
    e.preventDefault();
    send("Open", { url: link.href });
    return;
  }
  const el = e.target.closest("[data-act]");
  if (el?.tagName === "SUMMARY") e.preventDefault();
  // Why not treat every click on a cell as an action: a drag that selected
  // text is a selection.
  if (!el || (el.matches("td") && !getSelection().isCollapsed)) return;
  send("Act", { id: el.dataset.act, shift: e.shiftKey });
});

// Why not the cells the selection touches: as in a spreadsheet, its first and
// last cell span a rectangle.
document.addEventListener("copy", (e) => {
  const sel = getSelection();
  const cellOf = (node) => (node?.nodeType === Node.ELEMENT_NODE ? node : node?.parentElement)?.closest("td[data-r]");
  const [a, b] = [cellOf(sel.anchorNode), cellOf(sel.focusNode)];
  const block = a?.closest(".block");
  if (!a || !b || a === b || !block.contains(b)) return;
  const range = (x, y) => Array.from({ length: Math.abs(x - y) + 1 }, (_, i) => Math.min(x, y) + i);
  e.preventDefault();
  send("Copy", { block: +block.dataset.b, rows: range(+a.dataset.r, +b.dataset.r), cols: range(+a.dataset.c, +b.dataset.c) });
});

const TEXT = /^(text\/|application\/(json|xml|yaml|toml|javascript))|\.(txt|md|csv|tsv|json|log|ya?ml|toml|xml|html?|css|js|ts|mbt|nu|sh|py|rb|rs|go|swift)$/i;
async function attach(files) {
  for (const { file, name } of files) {
    const isText = TEXT.test(file.type) || TEXT.test(name);
    const data = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => reject(reader.error);
      isText ? reader.readAsText(file) : reader.readAsDataURL(file);
    });
    send("Attach", { name, media_type: file.type || (isText ? "text/plain" : "application/octet-stream"), data });
  }
  input.focus();
}

async function entriesOf(entry, path = "") {
  if (entry.isFile) return [{ file: await new Promise((ok, ng) => entry.file(ok, ng)), name: path + entry.name }];
  const reader = entry.createReader();
  const files = [];
  for (let batch; (batch = await new Promise((ok, ng) => reader.readEntries(ok, ng))).length; ) {
    for (const child of batch) files.push(...(await entriesOf(child, `${path}${entry.name}/`)));
  }
  return files;
}
document.addEventListener("dragover", (e) => e.preventDefault());
document.addEventListener("drop", async (e) => {
  e.preventDefault();
  const files = [];
  for (const item of e.dataTransfer.items) files.push(...(await entriesOf(item.webkitGetAsEntry())));
  attach(files);
});
input.addEventListener("paste", (e) => {
  const images = [...e.clipboardData.files].filter((f) => f.type.startsWith("image/"));
  if (images.length) {
    e.preventDefault();
    attach(images.map((file) => ({ file, name: file.name || "pasted.png" })));
  }
});

send("Init");
input.focus();
</script>
</html>
