<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<style>
:root {
  --bg: #fbfbfa;
  --panel: #ffffff;
  --fg: #1d1d1f;
  --muted: #6e6e73;
  --line: #e3e3e0;
  --accent: #2f6fde;
  --accent-soft: #e8f0fd;
  --danger: #c4372b;
  --danger-soft: #fdecea;
  --num: #0b6e4f;
  --nested: #7a4dc9;
  --select: #fff6d6;
  --mono: ui-monospace, "SF Mono", "Menlo", "Hiragino Kaku Gothic ProN", monospace;
  --sans: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
  color-scheme: light dark;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161618;
    --panel: #1e1e21;
    --fg: #ececf0;
    --muted: #9a9aa2;
    --line: #34343a;
    --accent: #7aa7ff;
    --accent-soft: #23314d;
    --danger: #ff8a7a;
    --danger-soft: #3d2320;
    --num: #6fd3a8;
    --nested: #c3a1ff;
    --select: #3a3420;
  }
}

* { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  color: var(--fg);
  font: 14px/1.5 var(--sans);
}


code, pre, textarea, .view-input { font-family: var(--mono); }
pre { margin: 0; padding: 10px 12px; overflow: auto; max-height: 60vh; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); font-size: 13px; }

button {
  font: inherit;
  color: inherit;
  background: none;
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 2px 8px;
  cursor: pointer;
}
button:hover { border-color: var(--accent); }

#out {
  flex: 1;
  overflow: auto;
  padding: 16px 16px 24px;
}
.entry {
  margin: 0 auto 28px;
  max-width: 1100px;
}
.said {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 6px 10px;
  margin-bottom: 10px;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--line);
}
.who { font-size: 12px; color: var(--muted); }
.input-text {
  margin: 0;
  flex: 1 1 auto;
  min-width: 0;
  white-space: pre-wrap;
  font-weight: 600;
}

.chip {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  padding: 1px 4px 1px 8px;
  border-radius: 999px;
  background: var(--accent-soft);
  font-size: 12px;
}
.chip .remove { border: 0; padding: 0 5px; color: var(--muted); }

.block { margin-bottom: 14px; }
.running { color: var(--muted); margin-bottom: 8px; }
.step { margin: 0 0 14px 8px; padding-left: 12px; border-left: 2px solid var(--line); }

.md { max-width: 760px; line-height: 1.7; }
.md h1, .md h2, .md h3 { line-height: 1.3; margin: 0.6em 0 0.4em; }
.md p { margin: 0.4em 0; }

.md :not(pre) > code { padding: 0 4px; border-radius: 4px; background: var(--accent-soft); }
.md blockquote { margin: 0.4em 0; padding-left: 12px; border-left: 3px solid var(--line); color: var(--muted); }
.md a { color: var(--accent); }

.page iframe {
  display: block;
  width: 100%;
  max-width: 760px;
  height: 240px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #fff;
  resize: vertical;
}

.file .info { color: var(--muted); font-size: 12px; }

.viewbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  margin-bottom: 8px;
}

.view-input {
  flex: 1 1 220px;
  min-width: 0;
  padding: 3px 8px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--panel);
  color: inherit;
  font-size: 13px;
}
.view-input:focus { outline: 0; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

.composer {
  border-top: 1px solid var(--line);
  background: var(--panel);
  padding: 8px 16px 12px;
}
#controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 6px; }
.programs { display: flex; gap: 4px; }
.pending { display: flex; flex-wrap: wrap; gap: 4px; }
.compose-row { display: flex; gap: 8px; align-items: flex-end; }
#input {
  flex: 1;
  min-width: 0;
  resize: none;
  padding: 8px 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--bg);
  color: inherit;
  font-size: 14px;
  line-height: 1.5;
}
#input:focus { outline: 0; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.file-button {
  white-space: nowrap;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 7px 10px;
  cursor: pointer;
  color: var(--muted);
}
.file-button:hover { border-color: var(--accent); color: var(--fg); }

.stage {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 4px 2px 10px;
  border-radius: 999px;
  background: var(--accent-soft);
}
.stage.failed { background: var(--danger-soft); color: var(--danger); }
.stage .remove { border: 0; padding: 0 6px; color: var(--muted); border-radius: 999px; }
.stage .remove:hover { color: var(--danger); }

.error {
  margin-bottom: 10px;
  padding: 8px 12px;
  border-radius: 8px;
  background: var(--danger-soft);
  color: var(--danger);
  font-family: var(--mono);
}

.toolbar, .selection, .text-actions, .toolbar span {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px 14px;
  margin-bottom: 10px;
  color: var(--muted);
}

.tab { border-color: transparent; padding: 1px 7px; }
.tab.active { background: var(--accent-soft); color: var(--accent); }
/* Floats so that selecting rows does not move the table under the cursor. */
.selection {
  position: fixed;
  bottom: 120px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 15;
  margin: 0;
  padding: 8px 12px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--select);
  color: var(--fg);
  box-shadow: 0 8px 24px rgb(0 0 0 / 0.18);
  max-width: calc(100vw - 32px);
}

.view.stale { opacity: 0.45; }

.table-wrap {
  width: fit-content;
  max-width: 100%;
  overflow: auto;
  max-height: 60vh;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel);
}
table.grid {
  border-collapse: separate;
  border-spacing: 0;
  font-family: var(--mono);
  font-size: 13px;
}
.grid th, .grid td {
  padding: 4px 10px;
  border-bottom: 1px solid var(--line);
  text-align: left;
  white-space: nowrap;
  vertical-align: top;
}
.grid thead th {
  position: sticky;
  top: 0;
  z-index: 2;
  background: var(--panel);
  font-family: var(--sans);
  font-weight: 600;
}
.grid th .sort { border: 0; padding: 0; font-weight: 600; }
.grid th .hide { border: 0; padding: 0 4px; color: var(--muted); visibility: hidden; }
.grid th:hover .hide { visibility: visible; }

.arrow { color: var(--accent); }
.grid .idx { color: var(--muted); text-align: right; user-select: none; }
.grid .sel { width: 1px; padding-right: 0; user-select: none; }
.check { border: 0; padding: 0; color: var(--muted); }
tr.selected td { background: var(--select); }
.grid tbody tr:hover td { background: var(--accent-soft); }
.grid tbody tr.selected:hover td { background: var(--select); }

td.cell { position: relative; cursor: pointer; }
td.num { color: var(--num); text-align: right; }
td.null { color: var(--muted); font-style: italic; }
td.nested { color: var(--nested); }
td.bool { color: var(--accent); }

.menu {
  position: fixed;
  z-index: 20;
  max-height: calc(100vh - 16px);
  overflow: auto;
  display: flex;
  flex-direction: column;
  min-width: 200px;
  padding: 4px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel);
  box-shadow: 0 8px 24px rgb(0 0 0 / 0.15);
  font-family: var(--sans);
  font-style: normal;
  color: var(--fg);
  text-align: left;
}
.menu .item { border: 0; text-align: left; padding: 4px 8px; border-radius: 4px; }
.menu .item:hover { background: var(--accent-soft); }
.menu .item code { color: var(--accent); }
.menu .close { color: var(--muted); }

.more { margin-top: 8px; }

.scalar { font: 600 40px/1.2 var(--mono); padding: 16px 0; color: var(--num); }
img { max-width: 100%; border-radius: 8px; background: #fff; }
.diagram svg { max-width: 100%; }
#send { padding: 7px 14px; border-radius: 8px; background: var(--accent); border-color: var(--accent); color: #fff; }
.small { font-size: 12px; color: var(--muted); padding: 0 6px; }

.tree {
  padding: 8px 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel);
  font-family: var(--mono);
  font-size: 13px;
}
.tree ul { list-style: none; margin: 0; padding-left: 18px; }
.tree > ul { padding-left: 0; }
.tree .key { color: var(--accent); cursor: pointer; }
.tree .key:hover { text-decoration: underline; }
.tree .summary { color: var(--muted); }

.welcome { max-width: 760px; margin: 0 auto; }
.welcome p { color: var(--muted); }
.welcome ul { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }

#toast {
  position: fixed;
  bottom: 130px;
  left: 50%;
  transform: translate(-50%, 20px);
  opacity: 0;
  padding: 8px 14px;
  border-radius: 8px;
  background: var(--fg);
  color: var(--bg);
  transition: opacity 0.2s, transform 0.2s;
  pointer-events: none;
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }

::placeholder { color: var(--muted); opacity: 0.6; }
</style>
<main id="out"></main>
<footer class="composer">
  <div id="controls"></div>
  <div class="compose-row">
    <textarea id="input" rows="1" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea>
    <label class="file-button">ファイル<input id="file" type="file" multiple hidden></label>
    <label class="file-button">フォルダ<input id="folder" type="file" webkitdirectory hidden></label>
    <button id="send">送信</button>
  </div>
</footer>
<div id="toast"></div>
<script>
const out = document.getElementById("out");
const input = document.getElementById("input");
const controls = document.getElementById("controls");
const toast = document.getElementById("toast");

function send(tag, fields) {
  webkit.messageHandlers.patchbay.postMessage(JSON.stringify(fields ? [tag, fields] : tag));
}

let toastTimer;
function flash(message) {
  toast.textContent = message;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove("show"), 1800);
}

// Why not replace the whole transcript: embedded pages would reload and
// scroll positions reset.
const drawn = new Map();
function drawTranscript(html) {
  const template = document.createElement("template");
  template.innerHTML = html;
  const fresh = [...template.content.firstElementChild.children];
  const keys = new Set(fresh.map((el) => el.dataset.key));
  for (const el of [...out.children]) if (!keys.has(el.dataset.key)) el.remove();
  let prev = null;
  for (const el of fresh) {
    const key = el.dataset.key;
    let current = out.querySelector(`:scope > [data-key="${key}"]`);
    if (!current || drawn.get(key) !== el.outerHTML) {
      drawn.set(key, el.outerHTML);
      if (current) {
        const restore = keepState(current);
        current.replaceWith(el);
        restore(el);
      }
      current = el;
    }
    if ((prev ? prev.nextElementSibling : out.firstElementChild) !== current) {
      prev ? prev.after(current) : out.prepend(current);
    }
    prev = current;
  }
}

// Why not take the view transform text from the frame: while typing, frames
// answer text that is already older than the field.
function keepState(old) {
  const focused = old.contains(document.activeElement) && document.activeElement.dataset.view;
  const { value, selectionStart, selectionEnd } = document.activeElement;
  const scrolls = [...old.querySelectorAll(".table-wrap")].map((w) => [w.scrollLeft, w.scrollTop]);
  return (el) => {
    el.querySelectorAll(".table-wrap").forEach((w, i) => scrolls[i] && ([w.scrollLeft, w.scrollTop] = scrolls[i]));
    const field = focused && el.querySelector(`[data-view="${focused}"]`);
    if (field) {
      field.value = value;
      field.focus();
      field.setSelectionRange(selectionStart, selectionEnd);
    }
  };
}

window.patchbay = {
  receive(frame) {
    drawTranscript(frame.html);
    controls.innerHTML = frame.controls;
    input.placeholder = frame.placeholder;
    if (frame.input != null) {
      input.value = frame.input;
      autosize();
      input.focus();
    }
    if (frame.notice) flash(frame.notice);
    placeMenu();
    if (frame.scroll) out.lastElementChild?.scrollIntoView({ block: "start" });
  },
};

// Why not position the menu in CSS: the scrolling table would clip it.
function placeMenu() {
  const menu = out.querySelector(".menu");
  if (!menu) return;
  const cell = menu.parentElement.getBoundingClientRect();
  const below = cell.bottom + menu.offsetHeight <= innerHeight;
  menu.style.left = `${Math.min(cell.left, innerWidth - menu.offsetWidth - 8)}px`;
  menu.style.top = `${below ? cell.bottom : Math.max(8, cell.top - menu.offsetHeight)}px`;
}
addEventListener("scroll", placeMenu, true);
addEventListener("resize", placeMenu);

function autosize() {
  input.style.height = "auto";
  input.style.height = `${Math.min(input.scrollHeight, 200)}px`;
}
input.addEventListener("input", autosize);
document.getElementById("send").addEventListener("click", () => send("Send", { text: input.value }));

input.addEventListener("keydown", (e) => {
  // Why not only `isComposing`: Safari reports the Enter that confirms an IME
  // conversion with keyCode 229 instead.
  if (e.isComposing || e.keyCode === 229) return;
  const atStart = input.selectionStart === 0 && input.selectionEnd === 0;
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    send("Send", { text: input.value });
  } else if ((e.key === "ArrowUp" && atStart) || (e.key === "ArrowDown" && input.selectionStart === input.value.length)) {
    e.preventDefault();
    send("History", { delta: e.key === "ArrowUp" ? -1 : 1, text: input.value });
  }
});

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") send("Escape");
});

out.addEventListener("input", (e) => {
  if (e.target.dataset.view) send("View", { block: +e.target.dataset.view, text: e.target.value });
});

// Why not let shift-click select text: it extends the row selection.
document.addEventListener("mousedown", (e) => {
  if (e.shiftKey && e.target.closest(".check")) e.preventDefault();
});

document.addEventListener("click", (e) => {
  const link = e.target.closest("a[href]");
  if (link) {
    e.preventDefault();
    send("Open", { url: link.href });
    return;
  }
  const el = e.target.closest("[data-act]");
  // Why not treat every click on a cell as an action: a drag that selected
  // text is a selection.
  if (!el || (el.matches("td") && !getSelection().isCollapsed)) return;
  send("Act", { id: el.dataset.act, shift: e.shiftKey });
});

// Why not the cells the selection touches: as in a spreadsheet, its first and
// last cell span a rectangle.
document.addEventListener("copy", (e) => {
  const sel = getSelection();
  const cellOf = (node) => (node?.nodeType === Node.ELEMENT_NODE ? node : node?.parentElement)?.closest("td[data-r]");
  const [a, b] = [cellOf(sel.anchorNode), cellOf(sel.focusNode)];
  const block = a?.closest(".block");
  if (!a || !b || a === b || !block.contains(b)) return;
  const range = (x, y) => Array.from({ length: Math.abs(x - y) + 1 }, (_, i) => Math.min(x, y) + i);
  e.preventDefault();
  send("Copy", { block: +block.dataset.b, rows: range(+a.dataset.r, +b.dataset.r), cols: range(+a.dataset.c, +b.dataset.c) });
});

const TEXT = /^(text\/|application\/(json|xml|yaml|toml|javascript))|\.(txt|md|csv|tsv|json|log|ya?ml|toml|xml|html?|css|js|ts|mbt|nu|sh|py|rb|rs|go|swift)$/i;
async function attach(files) {
  for (const { file, name } of files) {
    const isText = TEXT.test(file.type) || TEXT.test(name);
    const data = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => reject(reader.error);
      isText ? reader.readAsText(file) : reader.readAsDataURL(file);
    });
    send("Attach", { name, media_type: file.type || (isText ? "text/plain" : "application/octet-stream"), data });
  }
  input.focus();
}
const named = (files, path) => [...files].map((file) => ({ file, name: path(file) }));
document.getElementById("file").addEventListener("change", (e) => attach(named(e.target.files, (f) => f.name)));
document.getElementById("folder").addEventListener("change", (e) => attach(named(e.target.files, (f) => f.webkitRelativePath)));

async function entriesOf(entry, path = "") {
  if (entry.isFile) return [{ file: await new Promise((ok, ng) => entry.file(ok, ng)), name: path + entry.name }];
  const reader = entry.createReader();
  const files = [];
  for (let batch; (batch = await new Promise((ok, ng) => reader.readEntries(ok, ng))).length; ) {
    for (const child of batch) files.push(...(await entriesOf(child, `${path}${entry.name}/`)));
  }
  return files;
}
document.addEventListener("dragover", (e) => e.preventDefault());
document.addEventListener("drop", async (e) => {
  e.preventDefault();
  const files = [];
  for (const item of e.dataTransfer.items) files.push(...(await entriesOf(item.webkitGetAsEntry())));
  attach(files);
});
input.addEventListener("paste", (e) => {
  const images = [...e.clipboardData.files].filter((f) => f.type.startsWith("image/"));
  if (images.length) {
    e.preventDefault();
    attach(named(images, (f) => f.name || "pasted.png"));
  }
});

send("Init");
input.focus();
</script>
</html>
